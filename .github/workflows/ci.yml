name: Verify source and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and HTTP contract tests
        run: npm test
      - name: Public content and Git history
        run: npm run check -- --history
      - name: Windows script validation
        if: runner.os == 'Windows' && matrix.node == '24'
        shell: powershell
        run: |
          & .\tests\Test-PowerShell.ps1
          & .\tests\Test-Profile.ps1
          & .\tests\Test-Provisioning.ps1
      - name: Isolated watchdog tests without scheduled-task registration
        if: runner.os == 'Windows' && matrix.node == '24'
        shell: powershell
        run: '& .\tests\Test-Guardian.ps1'
      - name: Build allowlisted source release
        run: npm run release
      - name: Save source release for review
        if: github.event_name != 'pull_request' && runner.os == 'Windows' && matrix.node == '24'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
